<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:">
  <title>MD Viewer</title>
  <link rel="stylesheet" href="../../renderer-dist/renderer.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-head">
        <span id="root-name">폴더 없음</span>
        <button id="btn-graph" title="연결 그래프 (⌘⇧G)">◎</button>
        <button id="btn-open" title="폴더 열기 (⌘O)">폴더 열기</button>
      </div>
      <div id="loose-wrap" hidden>
        <div id="loose-head">따로 연 문서<span id="loose-count"></span></div>
        <nav id="loose" aria-label="따로 연 문서"></nav>
      </div>
      <nav id="tree" aria-label="문서 트리"></nav>
      <div id="outline-resizer" title="드래그로 목록/개요 높이 조절"></div>
      <div id="outline-head">
        <button id="panel-tab-outline" class="panel-tab active" type="button">개요</button>
        <button id="panel-tab-backlinks" class="panel-tab" type="button">백링크<span id="bl-badge"></span></button>
        <span class="outline-caret">▾</span>
      </div>
      <nav id="outline" aria-label="문서 개요"></nav>
      <nav id="backlinks" aria-label="백링크" hidden></nav>
    </aside>
    <div id="resizer" title="드래그로 폭 조절 · 더블클릭으로 초기화"></div>
    <main id="main">
      <div id="tabbar" role="tablist"></div>
      <div id="docs">
        <div id="empty-state">
          <p class="empty-title">MD Viewer</p>
          <p class="empty-hint">문서를 열어 보세요. 파일이나 폴더를 창에 끌어다 놓아도 됩니다.</p>
          <div class="empty-actions">
            <button id="es-file">파일 열기 <span class="es-key">⌘O</span></button>
            <button id="es-folder">폴더 열기 <span class="es-key">⇧⌘O</span></button>
          </div>
        </div>
        <div id="graphpanel" hidden>
          <div class="gp-bar">
            <span class="gp-title">연결 그래프</span>
            <span id="gp-info"></span>
            <span class="gp-spacer"></span>
            <button id="gp-scope" title="전체 / 현재 문서 주변 전환">전체</button>
            <button id="gp-relayout" title="다시 배치">재배치</button>
            <button id="gp-close" title="닫기 (Esc)">×</button>
          </div>
          <canvas id="graph-canvas"></canvas>
          <div class="gp-hint">노드 클릭 → 문서 열기 · 드래그 → 이동 · 휠 → 확대/축소</div>
        </div>
        <div id="searchpanel" hidden>
          <div class="sp-head">
            <input id="sp-input" type="text" placeholder="전체 검색 (폴더 내 .md)" spellcheck="false" autocomplete="off">
            <span id="sp-summary"></span>
            <button id="sp-close" title="닫기 (Esc)">×</button>
          </div>
          <div id="sp-results"></div>
        </div>
        <div id="findbar" hidden>
          <input id="find-input" type="text" placeholder="찾기" spellcheck="false" autocomplete="off">
          <button id="find-case" class="find-opt" title="대소문자 구분">Aa</button>
          <button id="find-regex" class="find-opt" title="정규식 사용">.*</button>
          <span id="find-count">0/0</span>
          <button id="find-prev" title="이전 (⇧Enter)">▲</button>
          <button id="find-next" title="다음 (Enter)">▼</button>
          <button id="find-close" title="닫기 (Esc)">×</button>
        </div>
      </div>
      <footer id="statusbar">
        <span id="st-path">—</span>
        <span class="st-right">
          <span>UTF-8</span>
          <span>GFM+Obsidian</span>
          <span id="st-words">0 words</span>
          <span id="st-watch">watching: off</span>
          <span id="st-note" hidden></span>
          <button id="st-save" title="소스 모드 변경 저장 (⌘S)" hidden>저장</button>
          <button id="st-source" title="소스 모드 (⌘⌥S) — 문서 전체 원문을 고칩니다" hidden>소스</button>
          <button id="st-revert" title="이 문서를 연 시점으로 되돌립니다" hidden>되돌리기</button>
          <button id="st-edit" title="편집 모드 (⌘⌥E) — 켜면 블록을 더블클릭해 고칠 수 있습니다">읽기</button>
          <button id="st-font" title="본문 글자 크기 (클릭하면 순환 · ⌘⌥+ / ⌘⌥-)">15px</button>
          <button id="btn-theme" title="테마 전환 (⌘⇧L)">☾</button>
        </span>
      </footer>
    </main>
  </div>
  <div id="update-bar" hidden>
    <span id="ub-msg"></span>
    <button id="ub-action"></button>
    <button id="ub-mute" title="자동 확인 끄기">자동 확인 끄기</button>
    <button id="ub-close" title="닫기">×</button>
  </div>
  <div id="drop-overlay" hidden><div class="drop-box">여기에 놓아 열기<span>.md · .pdf 파일 또는 폴더</span></div></div>
  <script src="../../renderer-dist/renderer.js"></script>
</body>
</html>
