name: Release

# v* 태그 push 시 macOS + Windows 앱을 패키징해 GitHub Release에 업로드한다 (DECISIONS.md D1·D2)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 릴리스를 단일 잡에서 먼저 생성 — 매트릭스 러너들의 동시 생성 경합 방지 (FAILURES.md Active Rule 1)
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" || echo "release already exists"

  package:
    needs: create-release
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 렌더러 번들 생성 — 이 단계가 없으면 renderer-dist가 패키지에서 누락되어
      # 설치본이 스타일·스크립트 없이 뼈대 HTML만 표시된다 (FAILURES.md)
      - name: Build renderer
        run: npm run bundle

      - name: Package & publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
